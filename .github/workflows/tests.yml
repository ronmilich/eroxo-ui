name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:conventions
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: library-coverage
          path: artifacts/coverage/
          if-no-files-found: error
      - run: pnpm test:ssr

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:docs
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:docs
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: docs-preview
          path: dev/dist
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dev/dist

  publish-docs:
    if: github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy

  consumers:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        peer: [minimum, latest]
    env:
      SOLID_PEER_TIER: ${{ matrix.peer }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps --only-shell chromium firefox webkit
      - name: Verify packed SPA, SSR and Start consumers in three browsers
        run: pnpm test:package
      - uses: actions/upload-artifact@v7
        with:
          name: package-sizes-${{ matrix.peer }}
          path: artifacts/size-report.md
          if-no-files-found: error

  # Keep the check name stable for when release branch protection is enabled.
  build:
    if: ${{ always() }}
    needs: [quality, consumers, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality and consumer job to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          CONSUMERS: ${{ needs.consumers.result }}
          DOCS: ${{ needs.docs.result }}
        run: test "$QUALITY" = success && test "$CONSUMERS" = success && test "$DOCS" = success
