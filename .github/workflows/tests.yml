name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm run build

      - name: Install fixture browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Verify packed consumers and measure entry sizes
        run: pnpm test:package

      - name: Attach package size report
        uses: actions/upload-artifact@v7
        with:
          name: ul-08-package-sizes
          path: artifacts/size-report.md
          if-no-files-found: error

      - name: Build playground
        run: pnpm build:docs

      - name: Test
        run: pnpm run test
        env:
          CI: true
